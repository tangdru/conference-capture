<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- maximum-scale=1 stops iOS Safari auto-zooming the whole page when a
         text input gets focus -- the 16px input font alone isn't always
         enough to prevent it. The in-app photo viewer's pinch/zoom is its
         own JS-driven canvas transform, unaffected by this. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0D" />
    <meta name="description" content="Conference Capture — capture notes, photos, and audio at conferences." />
    <title>Conference Capture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
